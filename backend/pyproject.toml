[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = [".venv", "**/migrations", "media", "logs", "staticfiles"]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]
